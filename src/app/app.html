<div class="flex min-h-screen flex-col">
  <!-- Fixed OA-red navbar (LodgeMaster style) -->
  <header class="bg-primary text-primary-content fixed inset-x-0 top-0 z-50 h-[50px] shadow-sm">
    <nav class="mx-auto flex h-full max-w-[1140px] items-center px-3" aria-label="Main">
      <a routerLink="/" class="flex items-center gap-2 text-lg font-medium text-white no-underline">
        <img src="favicon.svg" alt="" width="28" height="28" class="rounded-sm" />
        <span>Occoneechee Lodge #104 Online Registration</span>
      </a>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-[1140px] flex-1 px-3 pt-[70px] pb-10">
    <router-outlet />

    <div class="mt-12 space-y-2 text-center">
      <p>
        Questions or concerns? Send an email to
        <a href="mailto:registration@lodge104.com">registration@lodge104.com</a>.
      </p>
      <p><a href="https://lodge104.net/registration/refunds/">Refund Policy</a></p>
    </div>
  </main>

  <!-- Charcoal footer bar (LodgeMaster style) -->
  <footer class="bg-neutral text-neutral-content">
    <div
      class="mx-auto flex min-h-[50px] max-w-[1140px] flex-wrap items-center justify-center gap-x-2 px-3 py-3 text-center"
    >
      <span>&copy; {{ year }} Occoneechee Lodge #104, Order of the Arrow</span>
      <span aria-hidden="true">&middot;</span>
      <span class="opacity-70">{{ version }}</span>
    </div>
  </footer>
</div>
